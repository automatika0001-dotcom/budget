# Builds the Android app (APK) in the cloud and publishes it on the repo's Releases page.
# Runs when anything in android/ changes, or manually: Actions tab > Build Android app > Run workflow.
# Normal app updates (web files) do NOT need a new APK; the installed app picks them up by itself.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the removed 'tools' package, so name exactly what we need.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE. Add it in Settings > Secrets and variables > Actions (see README)."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: budzets-local-key
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Budzets.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Budžets Android app
          make_latest: true
          files: Budzets.apk
          body: |
            Download **Budzets.apk** below on your phone and open it to install.
            You only need to install this once. App updates arrive automatically when you push to GitHub.
