plugins {
    id 'com.android.application'
}

android {
    namespace 'lv.budzets.app'
    compileSdk 34

    defaultConfig {
        applicationId 'lv.budzets.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
        // The app loads its screens from here, so every push to GitHub updates it.
        buildConfigField 'String', 'APP_URL', '"https://automatika0001-dotcom.github.io/budget/"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'budzets'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
